name: Deploy Preview Page

on:
  push:
    branches: [main]
    paths:
      - 'web/index.html'
      - 'dist/index.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build preview bundle
        run: |
          # GitHub Pages 会把仓库根当站点根发布，
          # 把 web/index.html 与 dist/index.json 放到发布目录的根。
          mkdir -p _site
          cp web/index.html _site/index.html
          # 站点根需要能直接访问 /dist/index.json
          mkdir -p _site/dist
          cp dist/index.json _site/dist/index.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
